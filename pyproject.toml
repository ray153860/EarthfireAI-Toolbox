[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earthfireai-toolbox"
version = "0.1.0"
description = "Deterministic engineering learning tools for EarthfireAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pint==0.26.1", "numpy==2.5.3"]

[project.scripts]
earthfire-toolbox = "earthfireai_toolbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
