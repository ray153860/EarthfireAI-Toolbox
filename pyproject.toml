[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earthfireai-knowledge-base"
version = "0.1.0"
description = "Local document indexing and source-traceable FTS search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
documents = ["pypdf==6.18.1", "python-docx==1.2.0"]

[project.scripts]
earthfire-knowledge = "earthfireai_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
